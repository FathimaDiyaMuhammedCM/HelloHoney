version: "3.8"
services:
  mongodb:
    image: mongo:7
    container_name: hellohoney-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    container_name: hellohoney-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/hellohoney
      - JWT_SECRET=hellohoney_lab_secret_change_me
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    container_name: hellohoney-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mongo-data:
